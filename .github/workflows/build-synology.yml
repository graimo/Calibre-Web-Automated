name: Build Synology image

on:
  push:
    branches:
      - custom/synology
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synology-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: docker.io/graimo/calibre-web-automated

jobs:
  build-amd64:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PA_TOKEN }}

      - name: Protect commit tag from accidental overwrite
        run: |
          immutable_tag="${IMAGE_NAME}:synology-${GITHUB_SHA}"
          if docker buildx imagetools inspect "$immutable_tag" >/dev/null 2>&1; then
            echo "::error::The commit tag already exists: ${immutable_tag}"
            echo "Deploy the existing image by digest instead of rebuilding the same commit."
            exit 1
          fi

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=synology
            type=sha,prefix=synology-,format=long
          labels: |
            org.opencontainers.image.title=Calibre-Web Automated custom Synology build
            org.opencontainers.image.description=Custom CWA image for the graimo Synology deployment
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=CUSTOM-${{ github.sha }}

      - name: Verify published image
        run: docker buildx imagetools inspect "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Publish deployment details
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Synology image published"
            echo
            echo '```text'
            echo "${IMAGE_NAME}:synology-${GITHUB_SHA}"
            echo "${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo '```'
            echo
            echo "Platform: linux/amd64"
          } >> "$GITHUB_STEP_SUMMARY"
